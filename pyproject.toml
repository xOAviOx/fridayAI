[project]
name = "friday"
version = "0.1.0"
description = "FRIDAY — voice-controlled PC assistant"
requires-python = ">=3.11"
authors = [{ name = "avi" }]
readme = "README.md"
dependencies = [
    # Phase 0 only needs config + logging. Audio / STT / LLM / TTS deps
    # land in Phase 1 as each provider is implemented.
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Local CPU-only TTS. Pulls torch + transformers transitively (~2 GB on
# disk after first model download). Keep it as an extra so Phase 0
# config-only validation doesn't pay that cost.
tts-kokoro = [
    "kokoro>=0.9.4",
]

# Audio I/O: mic capture + speaker playback + global hotkey.
# Pulls PortAudio via the sounddevice wheel on Windows; on macOS/Linux
# the system PortAudio package is required separately.
audio = [
    "sounddevice>=0.4",
    "pynput>=1.7",
    "numpy>=1.26",
]

# Groq Whisper STT via the OpenAI-SDK-compatible client. The `openai`
# package is the wire driver — Groq just runs on it with a custom
# base_url. Pulls httpx transitively. ~6 MB total.
stt-groq = [
    "openai>=1.40",
]

# Builtin skills' side-effect deps. Lazy-imported inside skill bodies,
# so the registry stays import-clean even without these installed —
# only actually running media_control / system_info(battery|cpu) /
# type_text needs them.
skills = [
    "pyautogui>=0.9",
    "psutil>=5.9",
]

# Groq chat LLM via the OpenAI-SDK-compatible client. Same wire driver
# as stt-groq — kept as a separate extra so installs can pick exactly
# the pieces they need. Pulls httpx transitively.
llm-groq = [
    "openai>=1.40",
]

[project.scripts]
friday = "friday.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["friday"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
