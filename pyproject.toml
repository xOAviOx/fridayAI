[project]
name = "friday"
version = "0.1.0"
description = "FRIDAY — voice-controlled PC assistant"
requires-python = ">=3.11"
authors = [{ name = "avi" }]
readme = "README.md"
dependencies = [
    # Phase 0 only needs config + logging. Audio / STT / LLM / TTS deps
    # land in Phase 1 as each provider is implemented.
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
friday = "friday.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["friday"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
