# =========================================================================
# FRIDAY config
# Edit this file to switch providers, change hotkeys, or relax safety.
# Secrets go in .env, never here.
# =========================================================================

# Which provider implementation to use for each role.
# Switching brain/STT/TTS is a one-line change here — never code.
providers:
  stt: groq           # groq | local_whisper (Phase 2+)
  llm: groq           # groq | gemini | anthropic | openai_compat
  tts: kokoro         # kokoro (local, free, default) | elevenlabs (cloud)

# Per-provider settings. Only the section matching `providers.*` is used,
# but the others are validated too so a typo fails loudly.
llm:
  groq:
    # llama-3.3-70b-versatile : required for reliable tool calling with 30+ tools
    # llama-3.1-8b-instant    : 30k TPM but fails tool calls with many schemas
    model: llama-3.3-70b-versatile
    base_url: https://api.groq.com/openai/v1
  gemini:
    model: gemini-2.5-flash
  anthropic:
    model: claude-opus-4-8
    # Off by default — Anthropic API billing is separate from Pro.
    enabled: false
  # Any OpenAI-compatible endpoint — LM Studio, vLLM, local Ollama, etc.
  # Switch to it with:  providers.llm: openai_compat
  # Set OPENAI_COMPAT_API_KEY in .env
  openai_compat:
    base_url: https://api.openai.com/v1
    model: gpt-4o

stt:
  groq:
    model: whisper-large-v3-turbo

tts:
  # Local CPU-only TTS. No API key, no network, ~1s/sentence on a laptop.
  # First run downloads ~330 MB of weights into the HuggingFace cache.
  # Voice ids come from the Kokoro model card — `af_heart` is the upstream
  # default. `am_*` are male, `af_*` female, `b*` British, `a*` American.
  kokoro:
    voice: af_heart
    lang_code: a            # 'a' = American English; 'b' = British English
    speed: 1.0              # 1.0 = natural; 1.1–1.2 = snappier assistant

  # Opt-in cloud TTS. Requires ELEVENLABS_API_KEY in .env when selected.
  elevenlabs:
    voice_id: ""            # set to your preferred ElevenLabs voice id
    model: eleven_turbo_v2_5

audio:
  sample_rate: 16000
  channels: 1
  # Phase 2+: legacy PTT VAD flag (kept for compatibility, not used in Phase 7+).
  vad_enabled: false

  # Phase 7: always-on wake word + automatic end-of-speech detection.
  # Set enabled: true to switch from push-to-talk to hands-free mode.
  # PTT (ctrl+space) still works as a fallback even in wake-word mode.
  wake_word:
    enabled: true           # flip to true to activate
    model: hey_jarvis       # built-in: hey_jarvis | alexa | hey_mycroft | hey_rhasspy
    sensitivity: 0.1        # 0.0–1.0 — lower = more triggers, higher = fewer
    vad_aggressiveness: 2   # 0–3 — higher ends recording sooner in noisy rooms
    silence_ms: 900         # ms of consecutive silence that ends an utterance
    max_record_s: 15.0      # hard cap on utterance length

hotkeys:
  push_to_talk: ctrl+space
  panic: ctrl+shift+esc

# -------------------------------------------------------------------------
# Safety — this layer controls *your* machine. Defaults are paranoid.
# -------------------------------------------------------------------------
safety:
  # No actions actually execute — every intended action is logged instead.
  # Keep this true for all Phase 0/1 testing.
  dry_run: false

  # Phase 5: code execution is now enabled.
  # run_python runs code in a subprocess; run_shell uses shell_allowlist below.
  enable_code_exec: true
  enable_computer_use: false

  # Allow destructive skills (write_file, delete_file, etc.) to run
  # without a confirmation step. Safe to enable once you trust FRIDAY.
  skip_confirm_destructive: true

  # Anything outside these lists requires explicit confirmation.
  shell_allowlist:
    # basics
    - echo
    - ls
    - dir
    - pwd
    - whoami
    - cat
    - grep
    - find
    - which
    # files / dirs
    - mkdir
    - cp
    - mv
    - touch
    # processes
    - ps
    - kill
    - top
    # dev tools
    - git
    - python
    - python3
    - pip
    - pip3
    - uv
    - npm
    - node
    - npx
    - curl
    - wget
    # mac-specific
    - open
    - pbcopy
    - pbpaste
    - say

  app_allowlist:
    - spotify
    - chrome
    - firefox
    - notepad
    - code

# Rate-limit budgets per provider. We warn at warn_at_pct of the limit
# and back off on 429s with the server's retry-after header.
rate_limits:
  groq:
    requests_per_min: 30
    tokens_per_min: 30000       # llama-3.1-8b-instant free tier; 6000 for 70b
    requests_per_day: 14400
    warn_at_pct: 80
  gemini:
    requests_per_day: 1500
    tokens_per_min: 1000000
    warn_at_pct: 80

# -------------------------------------------------------------------------
# Proactive monitor — FRIDAY speaks up without being asked
# -------------------------------------------------------------------------
monitor:
  enabled: true
  battery_low_pct: 15       # alert when unplugged battery drops below this
  cpu_alert_pct: 85         # CPU % that counts as "high"
  cpu_sustained_s: 30       # must stay high this many seconds before alert
  ram_alert_pct: 90         # alert when RAM usage exceeds this %
  disk_alert_pct: 95        # alert when disk usage exceeds this %
  check_interval_s: 10      # how often the monitor wakes up
  alert_cooldown_s: 300     # same alert won't fire again within 5 minutes

logging:
  level: INFO
  # Every executed action is appended here with a timestamp.
  audit_path: friday_audit.log
